name: Publish Hot Fix

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "094954420758"

jobs:
  build:
    name: CDP-build-hotfix-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0 # Depth 0 is required for branch-based versioning

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run Tests
        run: |
          mkdir -p coverage
          chmod -R a+rw ./coverage
          docker compose -f compose.yaml -f compose.test.yaml run --rm "fcp-sfd-comms"

      - name: Publish Hot Fix
        uses: DEFRA/cdp-build-action/build-hotfix@4ab1468825e6361dc8503863359ca38d7234153d # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: SonarQubeScan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
